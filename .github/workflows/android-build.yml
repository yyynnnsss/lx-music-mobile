name: Build Android APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 配置Yarn淘宝镜像 + 安装依赖
        run: |
          yarn config set registry https://registry.npmmirror.com
          yarn install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 编译Release APK（gradle国内镜像）
        run: |
          cd android
          echo "systemProp.gradle.wrapperUrl=https://mirrors.cloud.tencent.com/gradle/gradle-\$GRADLE_VERSION-bin.zip" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lxmusic-apk
          path: android/app/build/outputs/apk/release/app-release.apk

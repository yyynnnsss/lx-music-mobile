name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置Yarn淘宝镜像 + 安装依赖
        run: |
          yarn config set registry https://registry.npmmirror.com
          yarn install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 替换掉原来出错的 setup-android@v3，手动安装SDK ==========
      - name: Install Android SDK cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses & install platform/build-tools
        run: |
          sdkmanager --licenses <<< "y"
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: 编译Release APK（gradle国内镜像）
        run: |
          cd android
          echo "systemProp.gradle.wrapperUrl=https://mirrors.cloud.tencent.com/gradle/gradle-\$GRADLE_VERSION-bin.zip" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lxmusic-apk
          path: android/app/build/outputs/apk/release/app-release.apk
